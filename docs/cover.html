<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>Skillbox cover</title>
  <style>
    @font-face {
      font-family: Space;
      src: url(space-grotesk.ttf);
      font-weight: 300 700;
    }
    * {
      box-sizing: border-box;
    }
    body {
      width: 1280px;
      height: 640px;
      margin: 0;
      padding: 48px 64px;
      background: #f4f2eb;
      color: #203b44;
      font-family: Space, sans-serif;
    }
    .brand {
      font-size: 26px;
      font-weight: 600;
    }
    .layout {
      display: grid;
      grid-template-columns: 1.6fr 1fr;
      gap: 32px;
      align-items: center;
    }
    h1 {
      font-size: 80px;
      font-weight: 500;
      line-height: 1.05;
      letter-spacing: -0.04em;
      margin: 64px 0 24px;
    }
    p {
      font-size: 24px;
      line-height: 1.5;
      color: #4c646b;
      margin: 0;
    }
    img {
      width: 100%;
    }
    footer {
      font-size: 16px;
      color: #4c646b;
      margin-top: 48px;
    }
  </style>
  <div class="brand">Skillbox</div>
  <div class="layout">
    <div>
      <h1>One skill folder.<br />Every tool.</h1>
      <p>Edit once.<br />Claude Code, Codex, and Cursor read it.</p>
    </div>
    <img src="icon-transparent.png" alt="Open archive box holding one card" />
  </div>
  <footer>Local files. Shared skills. Open source.</footer>
</html>
