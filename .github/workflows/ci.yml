# Least-privilege hermetic CI for skillbox.
# Runs the full sandbox suite on Ubuntu + macOS with Python 3.11 and 3.12
# coverage via a compact matrix (no full OS×Python cartesian product).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Compact coverage: both supported Pythons on Ubuntu, plus macOS once
        # (with 3.12) so OS and interpreter claims are each proven without a
        # 2×2 duplicate matrix.
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Hermetic suite
        run: bash tests/run_all.sh
